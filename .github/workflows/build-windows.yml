name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: pyinstaller pyinstaller.spec --clean --noconfirm

      - name: Smoke-check executable
        shell: pwsh
        run: |
          $exe = "dist\AndroidTVADBControlCenter.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build output not found: $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "exe size: $size bytes"
          if ($size -lt 1MB) {
            Write-Error "exe suspiciously small: $size bytes"
            exit 1
          }
          Write-Host "Smoke-check passed."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTVADBControlCenter-windows
          path: dist\AndroidTVADBControlCenter.exe
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AndroidTVADBControlCenter-windows

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --oneline HEAD~10..HEAD 2>/dev/null || git log --oneline)
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh release create latest AndroidTVADBControlCenter.exe \
            --title "Latest Build ($DATE)" \
            --notes "$CHANGELOG" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
